name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # rdkafka 启用 cmake-build，会在构建时编译内置 librdkafka
      - name: 安装 librdkafka 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential zlib1g-dev

      # 与 Cargo.toml 的 rust-version 保持一致
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 单元测试
        run: cargo test --locked

      - name: Release 构建
        run: cargo build --release --locked
