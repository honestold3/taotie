[package]
name = "taotie"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "signal"] }
axum = "0.7.5"
rdkafka = { version = "0.39", features = ["cmake-build", "tokio"] }
base64 = "0.22.1"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0.128", features = ["preserve_order"] }
anyhow = "1.0.97"
tower-http = { version = "0.5.2", features = ["cors"] }
garde = { version = "0.23.0", features = ["derive"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
prometheus = "0.14.0"
simd-json = "0.19.0"
# 全局分配器：多线程 + 高频小对象场景下，比 glibc malloc 的分配更快、碎片更可控
mimalloc = { version = "0.1", default-features = false }

[profile.dev]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
